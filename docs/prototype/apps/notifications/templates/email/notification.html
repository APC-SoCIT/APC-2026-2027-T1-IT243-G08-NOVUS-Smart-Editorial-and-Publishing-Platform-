<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#0f1a33;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background:#ffffff;border:1px solid #e2e7f0;border-radius:12px;">
        <tr><td style="padding:32px;">
          <p style="margin:0 0 4px;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#5b6b8c;">{{ site_name }}</p>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">Hi {{ user.first_name|default:"there" }},</p>
          <p style="margin:0 0 24px;font-size:17px;line-height:1.5;font-weight:bold;">{{ message }}</p>
          <p style="margin:0 0 24px;">
            <a href="{{ url }}"
               style="display:inline-block;padding:12px 22px;background:#0f1a33;color:#ffffff;border-radius:8px;font-size:15px;font-weight:bold;text-decoration:none;">Open it</a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#56627a;">
            You get these emails because you turned on email notices.
            <a href="{{ settings_url }}" style="color:#3d5ba9;">Change your settings</a> to stop them.
          </p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#8a94a8;">BOSS Media Philippines Inc.</p>
    </td></tr>
  </table>
</body>
</html>
